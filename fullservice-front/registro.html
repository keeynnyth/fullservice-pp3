

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Crear cuenta | FullService</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <!-- Estilos base compartidos -->
  <link rel="stylesheet" href="./assets/css/login.css" />
  <!-- Estilos específicos de registro -->
  <link rel="stylesheet" href="./assets/css/registro.css" />
</head>
<body>
  <div class="wrap">
    <h2>Crear cuenta</h2>
    <a href="login.html" class="btn btn-secondary">Ya tengo cuenta</a>

    <div id="feedback" class="flash" hidden></div>

    <form id="form-registro" class="card" autocomplete="on">
      <div class="grid">
        <div>
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" required />
        </div>
        <div>
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div>
          <label for="password">Contraseña</label>
          <input type="password" id="password" required />
        </div>

        <div>
          <label>Plan de suscripción</label>
          <div class="radio-group">
            <label><input type="radio" name="plan" value="standard" checked> Standard <span class="price">(AR$ 13.000/mes)</span></label>
            <label><input type="radio" name="plan" value="premium"> Premium <span class="price">(AR$ 20.000/mes)</span></label>
          </div>
        </div>
      </div>

      <div class="hr"></div>

      <h3 class="sub">Vehículos</h3>
      <div id="autos-container"></div>
      <button type="button" id="btn-add-auto" class="btn btn-primary">➕ Agregar otro vehículo</button>

      <template id="tpl-auto">
        <div class="auto-row">
          <div class="row">
            <div>
              <label>Marca</label>
              <select class="auto-marca" required>
                <option value="" disabled selected>Marca</option>
              </select>
            </div>
            <div>
              <label>Modelo</label>
              <select class="auto-modelo" required disabled>
                <option value="" disabled selected>Modelo</option>
              </select>
            </div>
            <div>
              <label>Año</label>
              <input type="number" class="auto-anio" min="1950" max="2099" placeholder="Ej: 2018" required>
            </div>
          </div>
          <div class="row-actions">
            <button type="button" class="btn btn-danger btn-remove-auto">Quitar</button>
          </div>
        </div>
      </template>

      <div class="hr"></div>

      <div class="inline">
        <input type="checkbox" id="accept_policies" required />
        <label for="accept_policies">
          Acepto la
          <a href="politicas.html" target="_blank" rel="noopener">Política de Privacidad y Tratamiento de Datos</a>
        </label>
      </div>

      <!-- Pasarela de pago al final -->
      <div id="pago-sim" class="pay-box">
        <div class="pay-row">
          <button type="button" id="btn-procesar" class="btn btn-primary">Procesar pago</button>
          <span id="pago-estado" class="muted"></span>
        </div>

        <div id="pago-flow" class="hidden">
          <div class="pay-title">Seleccioná medio de pago</div>
          <div class="pay-brands" id="brand-group">
            <label class="brand-pill">
              <input type="radio" name="card_brand" value="visa"> Visa
            </label>
            <label class="brand-pill">
              <input type="radio" name="card_brand" value="mastercard"> Mastercard
            </label>
          </div>

          <div class="two">
            <div>
              <label>Últimos 4 dígitos</label>
              <input type="text" id="card-last4" inputmode="numeric" maxlength="4" placeholder="1234">
            </div>
            <div>
              <label>Vencimiento (MM/YY)</label>
              <input type="text" id="card-exp" placeholder="MM/YY" maxlength="5">
            </div>
          </div>

          <button type="button" id="btn-pagar" class="btn btn-primary" disabled>Pagar</button>
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Crear cuenta</button>
       
      </div>
    </form>
  </div>

  <!-- Modal descarga comprobante -->
  <div id="modal-pdf" class="modal hidden">
    <div class="modal-card">
      <h3>🎉 ¡Cuenta creada con éxito!</h3>
      <p>¿Deseás descargar tu comprobante de pago ahora?</p>
      <div class="modal-actions">
        <button id="btn-pdf-si" class="btn btn-primary">Sí, descargar</button>
        <button id="btn-pdf-no" class="btn btn-secondary">No, continuar</button>
      </div>
    </div>
  </div>

  <!-- jsPDF para generar el comprobante -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" referrerpolicy="no-referrer"></script>
  <script src="./assets/js/registro.js" type="module"></script>
</body>
</html>
