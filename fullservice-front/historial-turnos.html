

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Historial de Turnos</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
 
  <link rel="stylesheet" href="./assets/css/historial-turnos.css">
  
</head>
<body>

<div class="container">
  <h2>Historial de Turnos</h2>
  <div id="lista-turnos"></div>

  <button class="btn-secundario" onclick="window.location.href='inicio.html'">🔙 Volver al inicio</button>
</div>

<script>
  const token = localStorage.getItem("token");

  if (!token) {
    alert("Debes iniciar sesión primero.");
    window.location.href = "login.html";
  }

  fetch("http://localhost:3000/turnos/historial", {
    method: "GET",
    headers: {
      "Authorization": "Bearer " + token
    }
  })
    .then(res => res.json())
    .then(data => {
      const contenedor = document.getElementById("lista-turnos");

      if (Array.isArray(data) && data.length > 0) {
        data.forEach(turno => {
          const div = document.createElement("div");
          div.className = "turno";

          div.innerHTML = `
            <p><strong>Fecha:</strong> ${turno.fecha}</p>
            <p><strong>Hora:</strong> ${turno.hora}</p>
            <p><strong>Servicios:</strong> ${turno.servicios}</p>
            <p><strong>Marca:</strong> ${turno.marca || '-'}</p>
            <p><strong>Modelo:</strong> ${turno.modelo || '-'}</p>
            <p><strong>Año:</strong> ${turno.anio || '-'}</p>
            <p><strong>Tipo de Taller:</strong> ${turno.taller || '-'}</p>
            <p><strong>Taller Seleccionado:</strong> ${turno.taller_seleccionado || '-'}</p>
            <p><strong>Nombre Taller Externo:</strong> ${turno.taller_externo_nombre || '-'}</p>
            <p><strong>Dirección Taller Externo:</strong> ${turno.taller_externo_direccion || '-'}</p>
            <p><strong>Teléfono Taller Externo:</strong> ${turno.taller_externo_telefono || '-'}</p>
            <p><strong>Comentario:</strong> ${turno.motivo || 'Sin comentarios'}</p>
          `;

          contenedor.appendChild(div);
        });
      } else {
        contenedor.innerHTML = "<p>No hay turnos registrados.</p>";
      }
    })
    .catch(err => {
      console.error("Error:", err);
      alert("Error al cargar los turnos.");
    });
</script>

</body>
</html>
